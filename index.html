<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHub Railway Map</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f6f8fa;
      color: #24292f;
      min-height: 100vh;
    }

    header {
      background: #24292f;
      color: #fff;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header h1 {
      font-size: 1.2rem;
      font-weight: 600;
    }

    .train-icon {
      font-size: 1.4rem;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    .input-card {
      background: #fff;
      border: 1px solid #d0d7de;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .input-card h2 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 14px;
      color: #24292f;
    }

    .input-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .input-row input {
      flex: 1;
      min-width: 200px;
      padding: 8px 12px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.15s;
    }

    .input-row input:focus {
      border-color: #0969da;
      box-shadow: 0 0 0 3px rgba(9,105,218,0.15);
    }

    .btn {
      padding: 8px 18px;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
      font-weight: 500;
      transition: opacity 0.15s;
    }

    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.5; cursor: default; }

    .btn-primary {
      background: #2da44e;
      color: #fff;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 14px 0;
      color: #57606a;
      font-size: 0.8rem;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #d0d7de;
    }

    .error-box {
      background: #fff8f0;
      border: 1px solid #d5a317;
      border-radius: 6px;
      padding: 12px 16px;
      font-size: 0.875rem;
      color: #7d4e00;
      margin-bottom: 16px;
      display: none;
    }

    .map-card {
      background: #fff;
      border: 1px solid #d0d7de;
      border-radius: 8px;
      overflow: hidden;
      display: none;
    }

    .map-card.visible { display: block; }

    .map-header {
      padding: 12px 20px;
      border-bottom: 1px solid #d0d7de;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .map-header span {
      font-size: 0.875rem;
      color: #57606a;
    }

    .map-wrapper {
      overflow-x: auto;
      padding: 8px;
    }

    #railway-svg {
      display: block;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 12px 20px;
      border-top: 1px solid #d0d7de;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.8rem;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .loading-indicator {
      text-align: center;
      padding: 40px;
      color: #57606a;
      font-size: 0.9rem;
      display: none;
    }

    .loading-indicator.visible { display: block; }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid #d0d7de;
      border-top-color: #0969da;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
  </style>
</head>
<body>
  <header>
    <span class="train-icon">🚆</span>
    <h1>GitHub Railway Map</h1>
  </header>

  <div class="container">
    <div class="input-card">
      <h2>路線図を生成</h2>
      <div class="input-row">
        <input type="text" id="username-input" placeholder="GitHub ユーザー名 (例: apple502j)" />
        <button class="btn btn-primary" id="btn-user" onclick="loadFromUser()">Visualize</button>
      </div>
      <div class="divider">または</div>
      <div class="input-row">
        <input type="url" id="data-url-input" placeholder="JSON データ URL (例: https://example.com/repos.json)" />
        <button class="btn btn-primary" id="btn-url" onclick="loadFromUrl()">Visualize</button>
      </div>
    </div>

    <div class="error-box" id="error-box"></div>
    <div class="loading-indicator" id="loading"><span class="spinner"></span>読み込み中...</div>

    <div class="map-card" id="map-card">
      <div class="map-header">
        <strong id="map-title"></strong>
        <span id="map-subtitle"></span>
      </div>
      <div class="map-wrapper">
        <svg id="railway-svg"></svg>
      </div>
      <div class="legend" id="legend"></div>
    </div>
  </div>

  <script>
    // ─── 色定義 ────────────────────────────────────────────────
    const LANG_COLORS = {
      'C#':         '#534AB7',
      'TypeScript': '#378ADD',
      'Python':     '#639922',
      'Lua':        '#BA7517',
      'JavaScript': '#EF9F27',
      'C++':        '#D85A30',
      'Java':       '#D4537E',
      'Go':         '#1D9E75',
      'Rust':       '#993C1D',
      'Ruby':       '#E24B4A',
      'PHP':        '#7F77DD',
      'Shell':      '#5F5E5A',
    };
    const DEFAULT_COLOR = '#888780';

    function getLangColor(lang) {
      return LANG_COLORS[lang] || DEFAULT_COLOR;
    }

    // ─── URL パラメータ処理 ────────────────────────────────────
    (function initFromUrlParams() {
      const params = new URLSearchParams(window.location.search);
      const dataUrl = params.get('dataUrl');
      const user = params.get('user');
      if (dataUrl) {
        document.getElementById('data-url-input').value = dataUrl;
        loadFromUrl();
      } else if (user) {
        document.getElementById('username-input').value = user;
        loadFromUser();
      }
    })();

    // ─── データ取得 ────────────────────────────────────────────
    async function loadFromUrl() {
      const url = document.getElementById('data-url-input').value.trim();
      if (!url) { showError('JSON データ URL を入力してください。'); return; }
      await fetchAndDraw(url, url);
    }

    async function loadFromUser() {
      const username = document.getElementById('username-input').value.trim();
      if (!username) { showError('GitHub ユーザー名を入力してください。'); return; }

      // /api/github-user が存在すればプロキシ経由、なければ直接 GitHub API
      const proxyUrl = `/api/github-user?user=${encodeURIComponent(username)}`;
      const directUrl = `https://api.github.com/users/${encodeURIComponent(username)}/repos?type=public&sort=created&per_page=100`;

      setLoading(true);
      hideError();

      // まずプロキシを試行
      try {
        const resp = await fetch(proxyUrl, { method: 'HEAD' });
        if (resp.ok || resp.status === 405) {
          // プロキシが存在する
          await fetchAndDraw(proxyUrl, username, { isProxy: true });
          return;
        }
      } catch (_) { /* プロキシなし */ }

      // 直接 GitHub API
      await fetchAndDraw(directUrl, username, { isGitHub: true });
    }

    async function fetchAndDraw(url, label, opts = {}) {
      setLoading(true);
      hideError();
      try {
        const resp = await fetch(url);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}: ${resp.statusText}`);
        const data = await resp.json();
        if (!Array.isArray(data)) throw new Error('レスポンスが配列形式ではありません。');
        if (data.length === 0) throw new Error('リポジトリデータが空です。');

        const repos = normalizeRepos(data);
        drawRailwayMap(repos, label);
      } catch (err) {
        showError(`データの取得に失敗しました: ${err.message}`);
      } finally {
        setLoading(false);
      }
    }

    // ─── データ正規化 ──────────────────────────────────────────
    function normalizeRepos(raw) {
      return raw
        .filter(r => r.name && r.created_at)
        .map(r => {
          let langs;
          if (Array.isArray(r.languages) && r.languages.length > 0) {
            langs = r.languages;
          } else if (Array.isArray(r.language)) {
            langs = r.language;
          } else if (typeof r.language === 'string' && r.language) {
            langs = [r.language];
          } else {
            langs = ['Unknown'];
          }
          return {
            name: r.name,
            created_at: new Date(r.created_at),
            languages: langs,
            url: r.html_url || r.url || null,
            description: r.description || '',
          };
        })
        .filter(r => !isNaN(r.created_at.getTime()))
        .sort((a, b) => a.created_at - b.created_at)
        .slice(-50); // 最新 50 件
    }

    // ─── バリセンタメソッド ────────────────────────────────────
    function computeSortedLanguages(repos) {
      const langTimes = {};
      repos.forEach(repo => {
        const t = repo.created_at.getTime();
        repo.languages.forEach(lang => {
          if (!langTimes[lang]) langTimes[lang] = [];
          langTimes[lang].push(t);
        });
      });

      const barycenters = {};
      Object.keys(langTimes).forEach(lang => {
        const times = langTimes[lang];
        barycenters[lang] = times.reduce((a, b) => a + b, 0) / times.length;
      });

      return Object.keys(barycenters).sort((a, b) => barycenters[a] - barycenters[b]);
    }

    // ─── SVG 描画（Mini Metro スタイル） ──────────────────────
    function drawRailwayMap(repos, label) {
      const sortedLangs = computeSortedLanguages(repos);
      const numLangs = sortedLangs.length;

      // レイアウト定数
      const ML = 140;           // 左マージン（言語ラベル用）
      const MR = 60;            // 右マージン
      const MT = 60;            // 上マージン
      const MB = 60;            // 下マージン
      const STATION_SPACING = 80; // 同一路線上の駅間隔（px）
      const LANG_HEIGHT = 80;   // 路線間の縦間隔（px）

      // 言語インデックスマップ
      const langIndex = {};
      sortedLangs.forEach((lang, i) => { langIndex[lang] = i; });

      // 各言語の駅リストを構築（作成日順・均等配置）
      const langStations = {};
      sortedLangs.forEach(lang => {
        const reposForLang = repos
          .filter(r => r.languages.includes(lang))
          .sort((a, b) => a.created_at - b.created_at);
        const y = MT + langIndex[lang] * LANG_HEIGHT;
        langStations[lang] = reposForLang.map((repo, j) => ({
          repo,
          x: ML + j * STATION_SPACING,
          y,
        }));
      });

      // SVG サイズ計算
      const maxStations = Math.max(...sortedLangs.map(l => langStations[l].length), 1);
      const svgWidth = Math.max(800, ML + maxStations * STATION_SPACING + MR);
      const svgHeight = Math.max(200, MT + MB + (numLangs - 1) * LANG_HEIGHT);

      // SVG 初期化
      const svg = document.getElementById('railway-svg');
      svg.innerHTML = '';
      svg.setAttribute('width', svgWidth);
      svg.setAttribute('height', svgHeight);
      svg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');

      // 背景
      appendSVG(svg, 'rect', { x: 0, y: 0, width: svgWidth, height: svgHeight, fill: '#fff' });

      // ① 路線を描画（言語ごとの色付き線）
      sortedLangs.forEach(lang => {
        const color = getLangColor(lang);
        const stations = langStations[lang];
        const y = MT + langIndex[lang] * LANG_HEIGHT;

        // 言語ラベル
        const text = appendSVG(svg, 'text', {
          x: ML - 16, y: y + 5,
          'text-anchor': 'end',
          fill: color,
          'font-size': 13,
          'font-weight': '600',
          'font-family': 'monospace',
        });
        text.textContent = lang;

        if (stations.length === 0) return;

        // 最初の駅前の延長線（薄め）
        appendSVG(svg, 'line', {
          x1: ML - 30, y1: y, x2: stations[0].x, y2: y,
          stroke: color, 'stroke-width': 3, opacity: 0.3,
          'stroke-linecap': 'round',
        });

        // 駅間の路線（連続する駅を結ぶ）
        for (let i = 0; i < stations.length - 1; i++) {
          const s1 = stations[i], s2 = stations[i + 1];
          appendSVG(svg, 'line', {
            x1: s1.x, y1: s1.y, x2: s2.x, y2: s2.y,
            stroke: color, 'stroke-width': 3,
            'stroke-linecap': 'round',
          });
        }

        // 最後の駅後の延長線（薄め）
        const last = stations[stations.length - 1];
        appendSVG(svg, 'line', {
          x1: last.x, y1: y, x2: last.x + STATION_SPACING * 0.4, y2: y,
          stroke: color, 'stroke-width': 3, opacity: 0.3,
          'stroke-linecap': 'round',
        });
      });

      // ② 乗り換え接続線を描画（斜め線で複数路線をつなぐ）
      repos.forEach(repo => {
        const langs = repo.languages.filter(l => langStations[l]);
        if (langs.length < 2) return;

        const positions = langs.map(lang => {
          const s = langStations[lang].find(st => st.repo === repo);
          return s ? { lang, x: s.x, y: s.y } : null;
        }).filter(Boolean);

        if (positions.length < 2) return;

        // 全ペア間を斜め線で接続
        for (let i = 0; i < positions.length; i++) {
          for (let j = i + 1; j < positions.length; j++) {
            appendSVG(svg, 'line', {
              x1: positions[i].x, y1: positions[i].y,
              x2: positions[j].x, y2: positions[j].y,
              stroke: '#9a9895',
              'stroke-width': 2,
              'stroke-dasharray': '5,3',
              opacity: 0.75,
              'stroke-linecap': 'round',
            });
          }
        }
      });

      // ③ 駅を描画（各言語の色・乗り換え駅は白ドット付き）
      repos.forEach(repo => {
        const langs = repo.languages.filter(l => langStations[l]);
        const isTransfer = langs.length > 1;

        langs.forEach(lang => {
          const station = langStations[lang].find(s => s.repo === repo);
          if (!station) return;
          const { x, y } = station;
          const color = getLangColor(lang);
          const r = isTransfer ? 8 : 6;

          let stationLabel = repo.name;
          if (repo.description && repo.description.trim()) {
            stationLabel += `\n${truncateDesc(repo.description)}`;
          }
          stationLabel += isTransfer
            ? `\n乗り換え駅\n[${langs.join(', ')}]`
            : `\n${lang}`;

          drawStation(svg, x, y, r, color, isTransfer ? 1.0 : 0.85, stationLabel, isTransfer ? langs : null, repo.url);

          // 乗り換え駅：白い中心ドット（Mini Metro スタイル）
          if (isTransfer) {
            appendSVG(svg, 'circle', {
              cx: x, cy: y, r: 3,
              fill: '#fff',
              'pointer-events': 'none',
            });
          }
        });
      });

      // 凡例更新
      updateLegend(sortedLangs);

      // マップカードを表示
      document.getElementById('map-title').textContent = label;
      document.getElementById('map-subtitle').textContent = `${repos.length} repos, ${numLangs} languages`;
      document.getElementById('map-card').classList.add('visible');
    }

    function drawStation(svg, cx, cy, r, color, opacity, label, langs, url) {
      const circle = appendSVG(svg, 'circle', {
        cx, cy, r,
        fill: color, opacity,
        style: url ? 'cursor:pointer' : 'cursor:default',
      });

      // ホバー動作
      circle.addEventListener('mouseenter', () => {
        circle.setAttribute('opacity', 1.0);
        circle.setAttribute('r', r + 2);
        showTooltip(cx, cy, label, svg);
      });
      circle.addEventListener('mouseleave', () => {
        circle.setAttribute('opacity', opacity);
        circle.setAttribute('r', r);
        hideTooltip(svg);
      });

      // クリックでリポジトリを開く
      if (url) {
        circle.addEventListener('click', () => {
          window.open(url, '_blank', 'noopener,noreferrer');
        });
      }
    }

    // ─── ツールチップ ──────────────────────────────────────────
    function showTooltip(x, y, label, svg) {
      hideTooltip(svg);

      const lines = label.split('\n');
      const padding = 8;
      const lineHeight = 16;
      const boxH = lines.length * lineHeight + padding * 2;
      const longestLine = lines.reduce((a, b) => a.length > b.length ? a : b, '');
      const boxW = longestLine.length * 7.5 + padding * 2;

      const svgW = parseInt(svg.getAttribute('width'));
      let tx = x + 12;
      if (tx + boxW > svgW - 10) tx = x - boxW - 12;
      const ty = y - boxH / 2;

      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g.setAttribute('id', 'tooltip');

      const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      rect.setAttribute('x', tx);
      rect.setAttribute('y', ty);
      rect.setAttribute('width', boxW);
      rect.setAttribute('height', boxH);
      rect.setAttribute('rx', 5);
      rect.setAttribute('fill', '#24292f');
      rect.setAttribute('opacity', 0.92);
      g.appendChild(rect);

      lines.forEach((line, i) => {
        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', tx + padding);
        text.setAttribute('y', ty + padding + (i + 1) * lineHeight - 3);
        text.setAttribute('fill', i === 0 ? '#fff' : '#adbac7');
        text.setAttribute('font-size', 12);
        text.setAttribute('font-family', 'monospace');
        text.setAttribute('pointer-events', 'none');
        text.textContent = line;
        g.appendChild(text);
      });

      svg.appendChild(g);
    }

    function hideTooltip(svg) {
      const tip = svg.getElementById('tooltip');
      if (tip) tip.remove();
    }

    // ─── 凡例 ──────────────────────────────────────────────────
    function updateLegend(langs) {
      const legend = document.getElementById('legend');
      legend.innerHTML = '';

      langs.forEach(lang => {
        const color = getLangColor(lang);
        const item = document.createElement('div');
        item.className = 'legend-item';

        const dot = document.createElement('div');
        dot.className = 'legend-dot';
        dot.style.background = color;

        const label = document.createElement('span');
        label.textContent = lang;

        item.appendChild(dot);
        item.appendChild(label);
        legend.appendChild(item);
      });

      // 乗り換え駅の凡例
      const xferItem = document.createElement('div');
      xferItem.className = 'legend-item';
      xferItem.innerHTML = `<div class="legend-dot" style="background:#888780;opacity:0.6"></div><span>乗り換え駅</span>`;
      legend.appendChild(xferItem);
    }

    // ─── SVG ヘルパー ──────────────────────────────────────────
    function truncateDesc(desc, max = 60) {
      return desc.length > max ? desc.slice(0, max) + '…' : desc;
    }

    function appendSVG(parent, tag, attrs) {
      const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
      Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
      parent.appendChild(el);
      return el;
    }

    // ─── UI ヘルパー ───────────────────────────────────────────
    function setLoading(val) {
      document.getElementById('loading').classList.toggle('visible', val);
      document.getElementById('btn-user').disabled = val;
      document.getElementById('btn-url').disabled = val;
      if (val) document.getElementById('map-card').classList.remove('visible');
    }

    function showError(msg) {
      const box = document.getElementById('error-box');
      box.textContent = msg;
      box.style.display = 'block';
    }

    function hideError() {
      document.getElementById('error-box').style.display = 'none';
    }

    // ─── Enter キー対応 ────────────────────────────────────────
    document.getElementById('username-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') loadFromUser();
    });
    document.getElementById('data-url-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') loadFromUrl();
    });
  </script>
</body>
</html>
