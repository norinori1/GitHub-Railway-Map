<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHub Railway Map</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f6f8fa;
      color: #24292f;
      min-height: 100vh;
    }

    header {
      background: #24292f;
      color: #fff;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header h1 {
      font-size: 1.2rem;
      font-weight: 600;
    }

    .train-icon {
      font-size: 1.4rem;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    .input-card {
      background: #fff;
      border: 1px solid #d0d7de;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .input-card h2 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 14px;
      color: #24292f;
    }

    .input-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .input-row input {
      flex: 1;
      min-width: 200px;
      padding: 8px 12px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.15s;
    }

    .input-row input:focus {
      border-color: #0969da;
      box-shadow: 0 0 0 3px rgba(9,105,218,0.15);
    }

    .btn {
      padding: 8px 18px;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
      font-weight: 500;
      transition: opacity 0.15s;
    }

    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.5; cursor: default; }

    .btn-primary {
      background: #2da44e;
      color: #fff;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 14px 0;
      color: #57606a;
      font-size: 0.8rem;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #d0d7de;
    }

    .error-box {
      background: #fff8f0;
      border: 1px solid #d5a317;
      border-radius: 6px;
      padding: 12px 16px;
      font-size: 0.875rem;
      color: #7d4e00;
      margin-bottom: 16px;
      display: none;
    }

    .map-card {
      background: #fff;
      border: 1px solid #d0d7de;
      border-radius: 8px;
      overflow: hidden;
      display: none;
    }

    .map-card.visible { display: block; }

    .map-header {
      padding: 12px 20px;
      border-bottom: 1px solid #d0d7de;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .map-header span {
      font-size: 0.875rem;
      color: #57606a;
    }

    .map-wrapper {
      overflow-x: auto;
      padding: 8px;
    }

    #railway-svg {
      display: block;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 12px 20px;
      border-top: 1px solid #d0d7de;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.8rem;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .loading-indicator {
      text-align: center;
      padding: 40px;
      color: #57606a;
      font-size: 0.9rem;
      display: none;
    }

    .loading-indicator.visible { display: block; }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid #d0d7de;
      border-top-color: #0969da;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
  </style>
  <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
  <header>
    <span class="train-icon">🚆</span>
    <h1>GitHub Railway Map</h1>
  </header>

  <div class="container">
    <div class="input-card">
      <h2>路線図を生成</h2>
      <div class="input-row">
        <input type="text" id="username-input" placeholder="GitHub ユーザー名 (例: apple502j)" />
        <button class="btn btn-primary" id="btn-user" onclick="loadFromUser()">Visualize</button>
      </div>
      <div class="divider">または</div>
      <div class="input-row">
        <input type="url" id="data-url-input" placeholder="JSON データ URL (例: https://example.com/repos.json)" />
        <button class="btn btn-primary" id="btn-url" onclick="loadFromUrl()">Visualize</button>
      </div>
    </div>

    <div class="error-box" id="error-box"></div>
    <div class="loading-indicator" id="loading"><span class="spinner"></span>読み込み中...</div>

    <div class="map-card" id="map-card">
      <div class="map-header">
        <strong id="map-title"></strong>
        <span id="map-subtitle"></span>
      </div>
      <div class="map-wrapper">
        <svg id="railway-svg"></svg>
      </div>
      <div class="legend" id="legend"></div>
    </div>
  </div>

  <script>
    // ─── 色定義 ────────────────────────────────────────────────
    const LANG_COLORS = {
      'C#':         '#534AB7',
      'TypeScript': '#378ADD',
      'Python':     '#639922',
      'Lua':        '#BA7517',
      'JavaScript': '#EF9F27',
      'C++':        '#D85A30',
      'Java':       '#D4537E',
      'Go':         '#1D9E75',
      'Rust':       '#993C1D',
      'Ruby':       '#E24B4A',
      'PHP':        '#7F77DD',
      'Shell':      '#5F5E5A',
    };
    const DEFAULT_COLOR = '#888780';

    function getLangColor(lang) {
      return LANG_COLORS[lang] || DEFAULT_COLOR;
    }

    // ─── URL パラメータ処理 ────────────────────────────────────
    (function initFromUrlParams() {
      const params = new URLSearchParams(window.location.search);
      const dataUrl = params.get('dataUrl');
      const user = params.get('user');
      if (dataUrl) {
        document.getElementById('data-url-input').value = dataUrl;
        loadFromUrl();
      } else if (user) {
        document.getElementById('username-input').value = user;
        loadFromUser();
      }
    })();

    // ─── データ取得 ────────────────────────────────────────────
    async function loadFromUrl() {
      const url = document.getElementById('data-url-input').value.trim();
      if (!url) { showError('JSON データ URL を入力してください。'); return; }
      await fetchAndDraw(url, url);
    }

    async function loadFromUser() {
      const username = document.getElementById('username-input').value.trim();
      if (!username) { showError('GitHub ユーザー名を入力してください。'); return; }

      // /api/github-user が存在すればプロキシ経由、なければ直接 GitHub API
      const proxyUrl = `/api/github-user?user=${encodeURIComponent(username)}`;
      const directUrl = `https://api.github.com/users/${encodeURIComponent(username)}/repos?type=public&sort=created&per_page=100`;

      setLoading(true);
      hideError();

      // まずプロキシを試行
      try {
        const resp = await fetch(proxyUrl, { method: 'HEAD' });
        if (resp.ok || resp.status === 405) {
          // プロキシが存在する
          await fetchAndDraw(proxyUrl, username, { isProxy: true });
          return;
        }
      } catch (_) { /* プロキシなし */ }

      // 直接 GitHub API
      await fetchAndDraw(directUrl, username, { isGitHub: true });
    }

    async function fetchAndDraw(url, label, opts = {}) {
      setLoading(true);
      hideError();
      try {
        const resp = await fetch(url);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}: ${resp.statusText}`);
        const data = await resp.json();
        if (!Array.isArray(data)) throw new Error('レスポンスが配列形式ではありません。');
        if (data.length === 0) throw new Error('リポジトリデータが空です。');

        const repos = normalizeRepos(data);
        drawRailwayMap(repos, label);
      } catch (err) {
        showError(`データの取得に失敗しました: ${err.message}`);
      } finally {
        setLoading(false);
      }
    }

    // ─── データ正規化 ──────────────────────────────────────────
    function normalizeRepos(raw) {
      return raw
        .filter(r => r.name && r.created_at)
        .map(r => {
          let langs;
          if (Array.isArray(r.languages) && r.languages.length > 0) {
            langs = r.languages;
          } else if (Array.isArray(r.language)) {
            langs = r.language;
          } else if (typeof r.language === 'string' && r.language) {
            langs = [r.language];
          } else {
            langs = ['Unknown'];
          }
          return {
            name: r.name,
            created_at: new Date(r.created_at),
            languages: langs,
            url: r.html_url || r.url || null,
            description: r.description || '',
          };
        })
        .filter(r => !isNaN(r.created_at.getTime()))
        .sort((a, b) => a.created_at - b.created_at)
        .slice(-50); // 最新 50 件
    }

    // ─── バリセンタメソッド ────────────────────────────────────
    function computeSortedLanguages(repos) {
      const langTimes = {};
      repos.forEach(repo => {
        const t = repo.created_at.getTime();
        repo.languages.forEach(lang => {
          if (!langTimes[lang]) langTimes[lang] = [];
          langTimes[lang].push(t);
        });
      });

      const barycenters = {};
      Object.keys(langTimes).forEach(lang => {
        const times = langTimes[lang];
        barycenters[lang] = times.reduce((a, b) => a + b, 0) / times.length;
      });

      return Object.keys(barycenters).sort((a, b) => barycenters[a] - barycenters[b]);
    }

    // ─── SVG 描画（Mini Metro スタイル - 力学モデル版） ────────
    function drawRailwayMap(repos, label) {
      const sortedLangs = computeSortedLanguages(repos);
      const numLangs = sortedLangs.length;
      if (numLangs === 0) return;

      const width = 1000;
      const height = 800;

      // D3 データ準備: ノード（リポジトリ）
      const nodes = repos.map(r => ({
        ...r,
        id: r.name,
        isTransfer: r.languages.length > 1
      }));

      // D3 データ準備: リンク（同一言語内の連続するリポジトリ）
      const links = [];
      sortedLangs.forEach(lang => {
        const langRepos = repos
          .filter(r => r.languages.includes(lang))
          .sort((a, b) => a.created_at - b.created_at);

        for (let i = 0; i < langRepos.length - 1; i++) {
          links.push({
            source: langRepos[i].name,
            target: langRepos[i+1].name,
            lang: lang
          });
        }
      });

      // SVG 初期化
      const svgElement = document.getElementById('railway-svg');
      svgElement.innerHTML = '';
      const svg = d3.select('#railway-svg')
        .attr('width', width)
        .attr('height', height);

      // 力学シミュレーション
      const simulation = d3.forceSimulation(nodes)
        .force('link', d3.forceLink(links).id(d => d.id).distance(120).strength(1))
        .force('charge', d3.forceManyBody().strength(-500))
        .force('x', d3.forceX(width / 2).strength(0.05))
        .force('y', d3.forceY(height / 2).strength(0.05))
        .force('collision', d3.forceCollide().radius(80))
        .stop();

      // シミュレーションを安定させる
      for (let i = 0; i < 300; ++i) simulation.tick();

      // 境界内に収める
      nodes.forEach(n => {
        n.x = Math.max(50, Math.min(width - 50, n.x));
        n.y = Math.max(50, Math.min(height - 50, n.y));
      });

      // ① 路線を描画（カクカクした線）
      const lineG = svg.append('g').attr('class', 'lines');

      // 各言語ごとにパスを生成
      sortedLangs.forEach(lang => {
        const color = getLangColor(lang);
        const langLinks = links.filter(l => l.lang === lang);
        if (langLinks.length === 0) {
           // 駅が1つの場合でも位置は確定している
           return;
        }

        // 連続するリンクを繋いでパスを作る
        const pathData = [];
        const langRepos = nodes.filter(n => n.languages.includes(lang))
                               .sort((a, b) => a.created_at - b.created_at);

        for (let i = 0; i < langRepos.length - 1; i++) {
          const s = langRepos[i], t = langRepos[i+1];
          pathData.push(...getMetroPath(s.x, s.y, t.x, t.y));
        }

        if (pathData.length > 0) {
          const dStr = `M ${pathData[0].x} ${pathData[0].y} ` +
                       pathData.slice(1).map(p => `L ${p.x} ${p.y}`).join(' ');

          lineG.append('path')
            .attr('d', dStr)
            .attr('stroke', color)
            .attr('stroke-width', 6)
            .attr('fill', 'none')
            .attr('stroke-linecap', 'round')
            .attr('stroke-linejoin', 'round');
        }
      });

      // ② 駅を描画
      const stationG = svg.append('g').attr('class', 'stations');
      nodes.forEach(node => {
        const isTransfer = node.languages.length > 1;
        const color = isTransfer ? '#fff' : getLangColor(node.languages[0]);
        const strokeColor = isTransfer ? '#333' : color;
        const r = isTransfer ? 7 : 5;

        const g = stationG.append('g')
          .attr('class', 'station')
          .style('cursor', node.url ? 'pointer' : 'default')
          .on('click', () => {
             if (node.url) window.open(node.url, '_blank', 'noopener,noreferrer');
          });

        // 外枠または塗りつぶし
        g.append('circle')
          .attr('cx', node.x)
          .attr('cy', node.y)
          .attr('r', r)
          .attr('fill', color)
          .attr('stroke', strokeColor)
          .attr('stroke-width', 2);

        if (isTransfer) {
          // 乗り換え駅の中央の点
          g.append('circle')
            .attr('cx', node.x)
            .attr('cy', node.y)
            .attr('r', 2)
            .attr('fill', '#333');
        }

        // 駅名ラベル
        g.append('text')
          .attr('x', node.x + 12)
          .attr('y', node.y + 4)
          .text(node.name)
          .attr('font-size', '11px')
          .attr('font-family', 'sans-serif')
          .attr('font-weight', 'bold')
          .attr('fill', '#24292f')
          .style('paint-order', 'stroke')
          .style('stroke', 'rgba(255,255,255,0.8)')
          .style('stroke-width', '3px')
          .style('stroke-linecap', 'butt')
          .style('stroke-linejoin', 'miter')
          .style('pointer-events', 'none');

        // ホバーツールチップ用の透明な広い当たり判定
        g.append('circle')
          .attr('cx', node.x)
          .attr('cy', node.y)
          .attr('r', 15)
          .attr('fill', 'transparent')
          .on('mouseenter', () => {
            let label = node.name;
            if (node.description) label += `\n${truncateDesc(node.description)}`;
            label += `\n[${node.languages.join(', ')}]`;
            showTooltip(node.x, node.y, label, svgElement);
          })
          .on('mouseleave', () => {
            hideTooltip(svgElement);
          });
      });

      // 凡例更新
      updateLegend(sortedLangs);

      // マップカードを表示
      document.getElementById('map-title').textContent = label;
      document.getElementById('map-subtitle').textContent = `${repos.length} repos, ${numLangs} languages`;
      document.getElementById('map-card').classList.add('visible');
    }

    // Mini Metro 風のパス計算 (45度/90度)
    function getMetroPath(x1, y1, x2, y2) {
      const dx = x2 - x1;
      const dy = y2 - y1;
      const absDx = Math.abs(dx);
      const absDy = Math.abs(dy);

      // すでに直線または45度の場合はそのまま
      if (absDx === 0 || absDy === 0 || Math.abs(absDx - absDy) < 1) {
        return [{x: x1, y: y1}, {x: x2, y: y2}];
      }

      // 中間点を計算して、45度と直線の組み合わせにする
      let midX1, midY1;
      if (absDx > absDy) {
        // 横に長い場合
        midX1 = x1 + Math.sign(dx) * (absDx - absDy);
        midY1 = y1;
      } else {
        // 縦に長い場合
        midX1 = x1;
        midY1 = y1 + Math.sign(dy) * (absDy - absDx);
      }

      return [{x: x1, y: y1}, {x: midX1, y: midY1}, {x: x2, y: y2}];
    }

    // ─── ツールチップ ──────────────────────────────────────────
    function showTooltip(x, y, label, svg) {
      hideTooltip(svg);

      const lines = label.split('\n');
      const padding = 8;
      const lineHeight = 16;
      const boxH = lines.length * lineHeight + padding * 2;
      const longestLine = lines.reduce((a, b) => a.length > b.length ? a : b, '');
      const boxW = longestLine.length * 7.5 + padding * 2;

      const svgW = parseInt(svg.getAttribute('width'));
      let tx = x + 12;
      if (tx + boxW > svgW - 10) tx = x - boxW - 12;
      const ty = y - boxH / 2;

      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g.setAttribute('id', 'tooltip');

      const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      rect.setAttribute('x', tx);
      rect.setAttribute('y', ty);
      rect.setAttribute('width', boxW);
      rect.setAttribute('height', boxH);
      rect.setAttribute('rx', 5);
      rect.setAttribute('fill', '#24292f');
      rect.setAttribute('opacity', 0.92);
      g.appendChild(rect);

      lines.forEach((line, i) => {
        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', tx + padding);
        text.setAttribute('y', ty + padding + (i + 1) * lineHeight - 3);
        text.setAttribute('fill', i === 0 ? '#fff' : '#adbac7');
        text.setAttribute('font-size', 12);
        text.setAttribute('font-family', 'monospace');
        text.setAttribute('pointer-events', 'none');
        text.textContent = line;
        g.appendChild(text);
      });

      svg.appendChild(g);
    }

    function hideTooltip(svg) {
      const tip = svg.getElementById('tooltip');
      if (tip) tip.remove();
    }

    // ─── 凡例 ──────────────────────────────────────────────────
    function updateLegend(langs) {
      const legend = document.getElementById('legend');
      legend.innerHTML = '';

      langs.forEach(lang => {
        const color = getLangColor(lang);
        const item = document.createElement('div');
        item.className = 'legend-item';

        const dot = document.createElement('div');
        dot.className = 'legend-dot';
        dot.style.background = color;

        const label = document.createElement('span');
        label.textContent = lang;

        item.appendChild(dot);
        item.appendChild(label);
        legend.appendChild(item);
      });

      // 乗り換え駅の凡例
      const xferItem = document.createElement('div');
      xferItem.className = 'legend-item';
      xferItem.innerHTML = `<div class="legend-dot" style="background:#888780;opacity:0.6"></div><span>乗り換え駅</span>`;
      legend.appendChild(xferItem);
    }

    // ─── SVG ヘルパー ──────────────────────────────────────────
    function truncateDesc(desc, max = 60) {
      return desc.length > max ? desc.slice(0, max) + '…' : desc;
    }

    // ─── UI ヘルパー ───────────────────────────────────────────
    function setLoading(val) {
      document.getElementById('loading').classList.toggle('visible', val);
      document.getElementById('btn-user').disabled = val;
      document.getElementById('btn-url').disabled = val;
      if (val) document.getElementById('map-card').classList.remove('visible');
    }

    function showError(msg) {
      const box = document.getElementById('error-box');
      box.textContent = msg;
      box.style.display = 'block';
    }

    function hideError() {
      document.getElementById('error-box').style.display = 'none';
    }

    // ─── Enter キー対応 ────────────────────────────────────────
    document.getElementById('username-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') loadFromUser();
    });
    document.getElementById('data-url-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') loadFromUrl();
    });
  </script>
</body>
</html>
